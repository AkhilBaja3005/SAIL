<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SAIL/RSP Cost Statement & Variance Excel Converter</title>
  <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: white;
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      width: 540px;
      text-align: center;
    }
    h2 { margin-top: 0; color: #1e293b; }
    p { color: #64748b; font-size: 0.95rem; line-height: 1.5; }
    .badge {
      display: inline-block;
      background: #e0f2fe;
      color: #0369a1;
      padding: 0.25rem 0.6rem;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }
    .select-wrapper {
      margin: 1.25rem 0 0.5rem 0;
      text-align: left;
    }
    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #475569;
      margin-bottom: 0.4rem;
    }
    select {
      width: 100%;
      padding: 0.6rem 0.8rem;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      background-color: #fff;
      font-size: 0.9rem;
      color: #1e293b;
      outline: none;
    }
    select:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2);
    }
    .dropzone {
      border: 2px dashed #94a3b8;
      border-radius: 8px;
      padding: 2rem 1rem;
      margin: 1.25rem 0;
      cursor: pointer;
      background: #f1f5f9;
      transition: all 0.2s;
    }
    .dropzone:hover, .dropzone.dragover {
      border-color: #2563eb;
      background: #eff6ff;
    }
    #status { font-size: 0.9rem; color: #2563eb; font-weight: 500; min-height: 1.5rem; }
  </style>
</head>
<body>

<div class="card">
  <span class="badge">Universal Converter</span>
  <h2>Cost Report Converter</h2>
  <p>Select report type and drop your <code>.txt</code> report to generate the formatted Excel workbook.</p>
  
  <div class="select-wrapper">
    <label for="reportType">Select Report Type:</label>
    <select id="reportType">
      <option value="auto">Auto-Detect</option>
      <option value="cost_sheet">Cost Sheet / Monthly Cost Statement (15 Columns)</option>
      <option value="variance">Cost Variance Report</option>
      <option value="element_wise">Element-Wise Cost Statement (10 Columns)</option>
    </select>
  </div>

  <div class="dropzone" id="dropzone">
    <span id="dropText">Drag & Drop .txt file here or <u>Browse</u></span>
    <input type="file" id="fileInput" accept=".txt" style="display:none;" />
  </div>

  <div id="status">Loading Python runtime in browser...</div>
</div>

<script>
  let pyodide = null;
  const statusEl = document.getElementById("status");
  const dropzone = document.getElementById("dropzone");
  const fileInput = document.getElementById("fileInput");
  const reportTypeSelect = document.getElementById("reportType");

  async function initPyodide() {
    try {
      pyodide = await loadPyodide();
      await pyodide.loadPackage("micropip");
      const micropip = pyodide.pyimport("micropip");
      await micropip.install("openpyxl");
      statusEl.textContent = "Ready! Select type and drop your .txt file.";
      statusEl.style.color = "#16a34a";
    } catch (err) {
      statusEl.textContent = "Failed to load Python environment: " + err.message;
      statusEl.style.color = "#dc2626";
    }
  }
  initPyodide();

  dropzone.addEventListener("click", () => fileInput.click());
  dropzone.addEventListener("dragover", (e) => {
    e.preventDefault();
    dropzone.classList.add("dragover");
  });
  dropzone.addEventListener("dragleave", () => dropzone.classList.remove("dragover"));
  dropzone.addEventListener("drop", (e) => {
    e.preventDefault();
    dropzone.classList.remove("dragover");
    if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
  });
  fileInput.addEventListener("change", (e) => {
    if (e.target.files.length) handleFile(e.target.files[0]);
  });

  async function handleFile(file) {
    if (!pyodide) {
      alert("Python environment is still loading. Please wait a moment.");
      return;
    }
    if (!file.name.endsWith(".txt")) {
      alert("Please upload a valid .txt file.");
      return;
    }

    statusEl.textContent = "Processing and creating multi-sheet Excel file...";
    statusEl.style.color = "#2563eb";

    const text = await file.text();
    pyodide.globals.set("raw_text", text);
    pyodide.globals.set("selected_mode", reportTypeSelect.value);

    const pythonScript = `
import re
import openpyxl
from openpyxl.styles import Font, PatternFill, Alignment, Border, Side
import io

def sanitize(val):
    if isinstance(val, str):
        return "".join(c for c in val if ord(c) >= 32 or c in "\\n\\t\\r").strip()
    return val

def format_cell_val(val):
    if val in ["-", "", "NaN", "Inf", None]:
        return val
    clean_num = str(val).replace(',', '').replace('-', '')
    if clean_num.replace('.', '', 1).isdigit():
        try:
            if str(val).strip().endswith('-'):
                return -float(str(val).replace(',', '')[:-1])
            else:
                return float(str(val).replace(',', ''))
        except ValueError:
            return val
    return val

def clean_cc_name_and_prod(cc_rest):
    m = re.search(r'Gross\\s+Production\\s*:\\s*([\\d,.]+)?', cc_rest, re.I)
    if m:
        cc_name = cc_rest[:m.start()].strip()
        gross_prod = m.group(1).strip() if m.group(1) else ""
    else:
        m2 = re.search(r'GROSS\\s+PRODN\\s*:\\s*([\\d,.]+)?', cc_rest, re.I)
        if m2:
            cc_name = cc_rest[:m2.start()].strip()
            gross_prod = m2.group(1).strip() if m2.group(1) else ""
        else:
            cc_name = cc_rest.strip()
            gross_prod = ""
    return re.sub(r'[\\t\\r\\n]+', ' ', cc_name).strip(), gross_prod

def parse_summary_by_end_position(line):
    line_clean = line.strip()
    if not line_clean or line_clean == 'SUMMARY':
        return None
        
    row = ['SUMMARY', '-', '-', '-', '-', '-', '-', '-', '-']
    matches = list(re.finditer(r'[\\d,.]+', line))
    for m in matches:
        val = m.group(0)
        end = m.end()
        if end <= 25:
            row[1] = val
        elif end <= 40:
            row[2] = val
        elif end <= 56:
            row[3] = val
        elif end <= 70:
            row[4] = val
        elif end <= 86:
            row[5] = val
        elif end <= 100:
            row[6] = val
        elif end <= 112:
            row[7] = val
        else:
            row[8] = val
    return row

raw_clean = "".join(c for c in raw_text if ord(c) >= 32 or c in "\\n\\t\\r\\f")

if selected_mode == "variance":
    is_variance, is_consolidated = True, False
elif selected_mode == "cost_sheet":
    is_variance, is_consolidated = False, True
elif selected_mode == "element_wise":
    is_variance, is_consolidated = False, False
else:
    is_variance = bool(re.search(r"COST\\s+VARIANCE\\s+REPORT", raw_clean, re.I))
    is_consolidated = bool(
        re.search(r"CONSOLIDATED\\s*\\(\\s*AFTER\\s+A/C\\s+CLOSING\\)", raw_clean, re.I) or
        re.search(r"MONTHLY\\s+COST\\s+STATEMENT", raw_clean, re.I) or
        re.search(r"C\\s*O\\s*S\\s*T\\s+E\\s*L\\s*E\\s*M\\s*E\\s*N\\s*T\\s*S", raw_clean, re.I)
    )

wb = openpyxl.Workbook()
default_sheet = wb.active
used_sheet_names = set()

thin_border = Border(left=Side(style='thin', color='D9D9D9'), right=Side(style='thin', color='D9D9D9'),
                     top=Side(style='thin', color='D9D9D9'), bottom=Side(style='thin', color='D9D9D9'))
header_fill_1 = PatternFill(start_color="1F4E79", end_color="1F4E79", fill_type="solid")
header_fill_2 = PatternFill(start_color="2F5597", end_color="2F5597", fill_type="solid")
header_fill_3 = PatternFill(start_color="335A80", end_color="335A80", fill_type="solid")
cat_fill = PatternFill(start_color="D9E1F2", end_color="D9E1F2", fill_type="solid")
subtotal_fill = PatternFill(start_color="F2F2F2", end_color="F2F2F2", fill_type="solid")
summary_fill = PatternFill(start_color="FFF2CC", end_color="FFF2CC", fill_type="solid")

def create_named_sheet(wb, default_sheet, is_first, cc_code, cc_name):
    raw_sheet_title = f"{cc_code} {cc_name}".strip()
    safe_name = re.sub(r'[\\\\/*?:\\[\\]]', '', raw_sheet_title).strip()[:30]
    base_name = safe_name
    counter = 1
    while safe_name in used_sheet_names:
        safe_name = f"{base_name[:27]}_{counter}"
        counter += 1
    used_sheet_names.add(safe_name)
    
    if is_first:
        ws = default_sheet
        ws.title = safe_name
    else:
        ws = wb.create_sheet(title=safe_name)
    ws.views.sheetView[0].showGridLines = True
    return ws

if is_variance:
    blocks = re.split(r'\\f|(?=SAIL/RSP\\s+COST VARIANCE REPORT)', raw_clean)
    parsed_sheets = []

    for block in blocks:
        block = block.strip()
        if not block or 'COST VARIANCE REPORT' not in block:
            continue
        
        cc_match = re.search(r'CC CODE\\s*:\\s*(\\w+)\\s+CC NAME\\s*:\\s*([^\\n\\r]+)', block)
        if not cc_match:
            continue
        
        cc_code = sanitize(cc_match.group(1))
        cc_name = sanitize(cc_match.group(2))
        
        period_match = re.search(r'Variance Period1\\s*:\\s*([^\\n\\r]+?)\\s+Period2\\s*:\\s*([^\\n\\r]+)', block)
        period1 = sanitize(period_match.group(1)) if period_match else ""
        period2 = sanitize(period_match.group(2)) if period_match else ""
        
        prep_match = re.search(r'PREPARED ON\\s+([^\\n\\r]+)', block)
        prepared_on = sanitize(prep_match.group(1)) if prep_match else ""
        
        prod_match = re.search(r'PRODUCTION\\s+1st Periiod\\s*:\\s*([^\\n\\r]+?)\\s+2nd Period\\s*:\\s*([^\\n\\r]+)', block)
        prod_p1 = sanitize(prod_match.group(1)) if prod_match else ""
        prod_p2 = sanitize(prod_match.group(2)) if prod_match else ""
        
        parsed_sheets.append({
            'cc_code': cc_code,
            'cc_name': cc_name,
            'period1': period1,
            'period2': period2,
            'prepared_on': prepared_on,
            'prod_p1': prod_p1,
            'prod_p2': prod_p2,
            'raw_block': block
        })

    for idx, item in enumerate(parsed_sheets):
        ws = create_named_sheet(wb, default_sheet, idx == 0, item['cc_code'], item['cc_name'])
        
        meta_text = (
            f"Variance Period1 : {item['period1']}    Period2 : {item['period2']}\\n"
            f"CC CODE : {item['cc_code']}    CC NAME : {item['cc_name']}\\n"
            f"PREPARED ON {item['prepared_on']}\\n"
            f"PRODUCTION 1st Period : {item['prod_p1']}    2nd Period : {item['prod_p2']}"
        )
        
        ws['A1'] = "COST VARIANCE REPORT"
        ws['A1'].font = Font(name="Calibri", size=11, bold=True, color="1F4E79")
        ws['A2'] = meta_text
        ws['A2'].font = Font(name="Calibri", size=10)
        ws['A2'].alignment = Alignment(wrap_text=True, vertical="top")
        ws.row_dimensions[2].height = 65
        ws.merge_cells('A2:M2')
        
        fill_meta = PatternFill(start_color="F2F4F7", end_color="F2F4F7", fill_type="solid")
        for r in range(1, 3):
            for c in range(1, 14):
                ws.cell(row=r, column=c).fill = fill_meta
                
        lines = item['raw_block'].split('\\n')
        table_rows = []
        start_table = False
        
        for line in lines:
            line_clean = line.strip()
            if "Element" in line_clean and "V-Rate" in line_clean:
                start_table = True
                continue
            if not start_table or not line_clean or line_clean.startswith('---'):
                continue
                
            if line_clean.startswith('CUM.') or line_clean.startswith('STOCK') or line_clean.startswith('TOTAL COST'):
                parts = re.split(r'\\s{2,}|\\t+', line_clean)
                label = parts[0]
                nums = re.findall(r'-?\\d+\\.?\\d*|NaN', line_clean[len(label):])
                row = [label, "", "", nums[0] if len(nums)>0 else "", nums[1] if len(nums)>1 else "",
                       "", "", nums[2] if len(nums)>2 else "", nums[3] if len(nums)>3 else "",
                       "", "", nums[4] if len(nums)>4 else "", nums[5] if len(nums)>5 else ""]
                table_rows.append(('summary', row))
                continue
                
            if "||" not in line:
                cat_name = line_clean.replace("##", "").replace("!!", "").strip()
                if cat_name:
                    table_rows.append(('category', [cat_name] + [""] * 12))
                continue
                
            parts = line.split('||')
            elem_raw = parts[0].strip()
            elem_clean = elem_raw.replace('=', '').replace('+', '').replace('@', '').replace('*', '').replace('!', '').replace('#', '').strip()
            
            is_subtotal = '@' in elem_raw or '#' in elem_raw or '*' in elem_raw or '!' in elem_raw or 'Total' in elem_raw
            row_type = 'subtotal' if is_subtotal else 'data'
            
            p1_tokens = parts[1].strip().split() if len(parts) > 1 else []
            p2_tokens = parts[2].strip().split() if len(parts) > 2 else []
            var_tokens = parts[3].strip().split() if len(parts) > 3 else []
            
            def pad_tokens(tokens, length=4):
                return tokens + [""] * (length - len(tokens))
                
            row_vals = [elem_clean] + pad_tokens(p1_tokens, 4) + pad_tokens(p2_tokens, 4) + pad_tokens(var_tokens, 4)
            table_rows.append((row_type, row_vals))
            
        ws['A4'] = "Element / Cost Category"
        ws.merge_cells('B4:E4')
        ws['B4'] = "Period 1"
        ws.merge_cells('F4:I4')
        ws['F4'] = "Period 2"
        ws.merge_cells('J4:M4')
        ws['J4'] = "Cost Variance"
        
        subheaders = [
            "Line Item",
            "V-Rate (Rs/Unit)", "Usage", "V-Cost (Rs/T)", "F-Cost (Rs/T)",
            "V-Rate (Rs/Unit)", "Usage", "V-Cost (Rs/T)", "F-Cost (Rs/T)",
            "V-Rate (Rs/Unit)", "Usage", "V-Cost (Rs/T)", "F-Cost (Rs/T)"
        ]
        for c_idx, subh in enumerate(subheaders, 1):
            cell4 = ws.cell(row=4, column=c_idx)
            cell5 = ws.cell(row=5, column=c_idx, value=subh)
            cell4.fill = header_fill_1
            cell4.font = Font(name="Calibri", size=10, bold=True, color="FFFFFF")
            cell4.alignment = Alignment(horizontal="center", vertical="center")
            cell5.fill = header_fill_2
            cell5.font = Font(name="Calibri", size=9, bold=True, color="FFFFFF")
            cell5.alignment = Alignment(horizontal="center", vertical="center", wrap_text=True)
            
        ws.row_dimensions[4].height = 22
        ws.row_dimensions[5].height = 26
        
        current_r = 6
        for r_type, vals in table_rows:
            for c_idx, val in enumerate(vals, 1):
                cell = ws.cell(row=current_r, column=c_idx)
                cell.value = format_cell_val(val) if c_idx > 1 else val
                cell.border = thin_border
                
                if c_idx == 1:
                    cell.alignment = Alignment(horizontal="left", vertical="center")
                else:
                    cell.alignment = Alignment(horizontal="right", vertical="center")
                    
                if r_type == 'category':
                    cell.fill = cat_fill
                    cell.font = Font(name="Calibri", size=9, bold=True, color="1F4E79")
                elif r_type == 'subtotal':
                    cell.fill = subtotal_fill
                    cell.font = Font(name="Calibri", size=9, bold=True)
                elif r_type == 'summary':
                    cell.fill = summary_fill
                    cell.font = Font(name="Calibri", size=9, bold=True, color="805300")
                else:
                    cell.font = Font(name="Calibri", size=9)
                    
            if r_type == 'category':
                ws.merge_cells(start_row=current_r, start_column=1, end_row=current_r, end_column=13)
                
            current_r += 1
            
        ws.column_dimensions['A'].width = 30
        for col_letter in ['B', 'C', 'D', 'E', 'F', 'G', 'H', 'I', 'J', 'K', 'L', 'M']:
            ws.column_dimensions[col_letter].width = 14

elif is_consolidated:
    def is_numbered_header_row(line_clean):
        cleaned = re.sub(r'[^0-9\\s]', ' ', line_clean)
        nums = [int(n) for n in re.findall(r'\\b\\d+\\b', cleaned)]
        if nums and nums[:5] == [1, 2, 3, 4, 5]:
            return True
        if len(nums) >= 10 and all(nums[i] < nums[i+1] for i in range(len(nums)-1)):
            return True
        return False

    pages = re.split(r'\\f|(?=X00\\s+SAIL/RSP\\s+CONSOLIDATED)|(?=@?\\s*SAIL\\s*/?\\s*RSP\\s+MONTHLY\\s+COST\\s+STATEMENT)', raw_clean)
    cost_centers = {}
    cc_order = []

    boundaries_15 = [
        (0, 31), (31, 41), (41, 54), (54, 69), (69, 83),
        (83, 97), (97, 112), (112, 127), (127, 140), (140, 151),
        (151, 162), (162, 174), (174, 186), (186, 198), (198, 220)
    ]

    dist_slices = [
        (0, 40), (40, 70), (70, 86), (86, 112), (112, 128),
        (128, 145), (145, 163), (163, 181), (181, 205)
    ]

    for page in pages:
        page = page.strip()
        if not page or ('CONSOLIDATED' not in page and 'MONTHLY COST STATEMENT' not in page):
            continue
            
        cc_match = re.search(r'CC CODE\\s*:\\s*(\\w+)\\s+([^\\n\\r]+)', page)
        if not cc_match:
            continue
            
        cc_code = sanitize(cc_match.group(1))
        cc_name, gross_prod = clean_cc_name_and_prod(sanitize(cc_match.group(2)))
        
        period_match = re.search(r'PERIOD:\\s*([^\\n\\r\\t]+)', page)
        period = sanitize(period_match.group(1).split()[0]) if period_match else ""
        
        print_match = re.search(r'PRINT DATE:\\s*([^\\n\\r\\t ]+)', page)
        print_date = sanitize(print_match.group(1)) if print_match else ""
        
        if cc_code not in cost_centers:
            cost_centers[cc_code] = {
                'cc_code': cc_code,
                'cc_name': cc_name,
                'period': period,
                'print_date': print_date,
                'gross_prod': gross_prod,
                'cost_elements': [],
                'cost_summary': [],
                'distribution': []
            }
            cc_order.append(cc_code)
            
        mode = 'main'
        for line in page.split('\\n'):
            line_str = line.rstrip()
            line_clean = line_str.strip()
            if not line_clean:
                continue
                
            if 'SAIL/RSP' in line_clean or 'CONSOLIDATED' in line_clean or 'PRINT DATE:' in line_clean or 'MONTHLY COST STATEMENT' in line_clean:
                continue
            if 'CC CODE:' in line_clean or 'CC CODE :' in line_clean or 'GROSS PRODN :' in line_clean or 'Page-' in line_clean or 'Page :' in line_clean or 'X04' in line_clean or 'X00' in line_clean:
                continue
            if is_numbered_header_row(line_clean):
                continue
            if not re.search(r'[A-Za-z0-9]', line_clean):
                continue
                
            if 'COST/UNIT (Rs.)' in line_clean or line_clean.startswith('COST/UNIT'):
                mode = 'cost_unit'
                continue
            if 'DISTRIBUTION' in line_clean:
                mode = 'distribution'
                continue
            if 'C O S T   E L E M E N T S' in line_clean or 'AMOUNT' in line_clean or 'COST PER UNIT PRODUCTION' in line_clean or 'PER   UNIT' in line_clean:
                continue
            if 'To   Department' in line_clean or 'CBDI Rate' in line_clean:
                continue
            if line_clean.startswith('COST      Var cost'):
                continue
                
            if mode == 'main':
                if not re.search(r'\\d|NaN|Inf', line_clean):
                    cost_centers[cc_code]['cost_elements'].append(('category', sanitize(line_clean)))
                    continue
                    
                middle_has_num = bool(re.search(r'\\d', line_str[41:69])) if len(line_str) > 41 else False
                if not middle_has_num:
                    desc = sanitize(line_str[:69])
                    unit = "-"
                    rate = "-"
                    qty = "-"
                else:
                    desc = sanitize(line_str[:31])
                    unit = sanitize(line_str[31:41]) if len(line_str) > 31 else "-"
                    rate = sanitize(line_str[41:54]) if len(line_str) > 41 else "-"
                    qty  = sanitize(line_str[54:69]) if len(line_str) > 54 else "-"
                    
                vals = [desc if desc else "-", unit if unit else "-", rate if rate else "-", qty if qty else "-"]
                for s, e in boundaries_15[4:]:
                    val = sanitize(line_str[s:e]) if len(line_str) > s else ""
                    vals.append(val if val else "-")
                    
                is_subtotal = any(k in desc.upper() for k in ["TOTAL", "SUB-TOT", "CBDI", "WORKS COST", "SUMMARY", "NET "])
                cost_centers[cc_code]['cost_elements'].append(('subtotal' if is_subtotal else 'data', vals))
                
            elif mode == 'cost_unit':
                res = parse_summary_by_end_position(line_str)
                if res:
                    cost_centers[cc_code]['cost_summary'].append(res)
                
            elif mode == 'distribution':
                vals = [sanitize(line_str[s:e]) if len(line_str) > s else "" for s, e in dist_slices]
                vals = [v if v else "-" for v in vals]
                cost_centers[cc_code]['distribution'].append(vals)

    for idx, cc_code in enumerate(cc_order):
        item = cost_centers[cc_code]
        ws = create_named_sheet(wb, default_sheet, idx == 0, item['cc_code'], item['cc_name'])
        
        meta_text = (
            f"Period : {item['period']}    Print Date : {item['print_date']}\\n"
            f"CC CODE : {item['cc_code']}    CC NAME : {item['cc_name']}\\n"
            f"Gross Production : {item['gross_prod']} TONNE"
        )
        
        ws['A1'] = "COST STATEMENT (15-COLUMN)"
        ws['A1'].font = Font(name="Calibri", size=11, bold=True, color="1F4E79")
        ws['A2'] = meta_text
        ws['A2'].font = Font(name="Calibri", size=10)
        ws['A2'].alignment = Alignment(wrap_text=True, vertical="top")
        ws.row_dimensions[2].height = 45
        ws.merge_cells('A2:O2')
